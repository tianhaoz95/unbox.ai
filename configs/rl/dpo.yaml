model_path: checkpoints/sft/basic/checkpoint-3000
output_dir: checkpoints/rl/dpo

# Use local path when HuggingFace Hub is unreachable (e.g. network-restricted machines);
# requires dataset already downloaded to data/ultrafeedback_binarized/ via huggingface-cli download
dataset_name: data/ultrafeedback_binarized
# Use HuggingFace Hub path when internet access is available; auto-downloads and caches
# dataset_name: HuggingFaceH4/ultrafeedback_binarized
train_split: train_prefs
eval_split: test_prefs
max_samples: -1

# DPO hyperparameters
beta: 0.1
loss_type: sigmoid
max_length: 2048

# Training
num_epochs: 1
batch_size: 2
grad_accumulation_steps: 4
learning_rate: 5.0e-7
warmup_steps: 100
weight_decay: 0.01
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
dtype: bfloat16

# Logging / saving
log_every_steps: 10
eval_every_steps: 200
save_every_steps: 500
use_wandb: true
wandb_project: unbox-ai-dpo
wandb_run_name: "dpo-ultrafeedback-760m"
