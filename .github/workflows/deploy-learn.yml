name: Deploy Learn Site to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "apps/learn/**"
      - ".github/workflows/deploy-learn.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/learn/package-lock.json

      - name: Install dependencies
        working-directory: apps/learn
        run: npm ci

      - name: Build
        working-directory: apps/learn
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          cd apps/learn
          firebase deploy --only hosting:unbox-ai-learn
