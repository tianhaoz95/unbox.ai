name: Deploy Learn Site to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "apps/learn/**"
      - ".github/workflows/deploy-learn.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/learn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/learn/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNBOX_AI_PROJECT }}
          projectId: unbox-ai-project
          target: unbox-ai-learn
          channelId: live
          entryPoint: apps/learn
